<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- 深蓝渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2440;stop-opacity:1" />
    </linearGradient>
    
    <!-- 金色渐变 -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d9a0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 面料纹理图案 -->
    <pattern id="fabricPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 L20,10 M10,0 L10,20" stroke="#2a5298" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    
    <!-- 箭头渐变 -->
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d9a0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 光晕效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="600" fill="url(#bgGradient)"/>
  
  <!-- 面料纹理层 -->
  <rect width="1920" height="600" fill="url(#fabricPattern)"/>
  
  <!-- 装饰性金色线条 - 左侧 -->
  <line x1="100" y1="150" x2="500" y2="150" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="450" x2="500" y2="450" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="150" x2="100" y2="450" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- 装饰性金色线条 - 右侧 -->
  <line x1="1420" y1="150" x2="1820" y2="150" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="1420" y1="450" x2="1820" y2="450" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="1820" y1="150" x2="1820" y2="450" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- 左侧：面料纹理抽象图形 -->
  <g transform="translate(300, 300)">
    <!-- 面料卷筒 -->
    <ellipse cx="-80" cy="0" rx="40" ry="80" fill="none" stroke="#d4a574" stroke-width="3" opacity="0.8"/>
    <ellipse cx="-80" cy="0" rx="35" ry="75" fill="none" stroke="#f0d9a0" stroke-width="2" opacity="0.6"/>
    
    <!-- 面料纹理线条 -->
    <g opacity="0.7">
      <path d="M-120,0 Q-80,-100 0,-120" stroke="#d4a574" stroke-width="2" fill="none"/>
      <path d="M-120,20 Q-80,-80 0,-100" stroke="#f0d9a0" stroke-width="2" fill="none"/>
      <path d="M-120,40 Q-80,-60 0,-80" stroke="#d4a574" stroke-width="2" fill="none"/>
      <path d="M-120,60 Q-80,-40 0,-60" stroke="#f0d9a0" stroke-width="2" fill="none"/>
      <path d="M-120,80 Q-80,-20 0,-40" stroke="#d4a574" stroke-width="2" fill="none"/>
    </g>
    
    <!-- 纱线细节 -->
    <circle cx="-90" cy="-30" r="3" fill="#f0d9a0" opacity="0.8"/>
    <circle cx="-70" cy="-50" r="2" fill="#d4a574" opacity="0.8"/>
    <circle cx="-50" cy="-70" r="3" fill="#f0d9a0" opacity="0.8"/>
  </g>
  
  <!-- 中间：动态箭头连接 -->
  <g transform="translate(960, 300)">
    <!-- 主箭头 -->
    <path d="M-200,0 L200,0" stroke="url(#arrowGradient)" stroke-width="4" fill="none" filter="url(#glow)"/>
    
    <!-- 箭头头部 -->
    <polygon points="200,-10 220,0 200,10" fill="#f0d9a0" filter="url(#glow)"/>
    
    <!-- 动态粒子效果 -->
    <circle cx="-100" cy="0" r="4" fill="#d4a574" opacity="0.8">
      <animate attributeName="cx" from="-200" to="200" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-50" cy="-5" r="3" fill="#f0d9a0" opacity="0.6">
      <animate attributeName="cx" from="-200" to="200" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 中间文字 -->
    <text x="0" y="-30" font-family="Arial, sans-serif" font-size="24" fill="#f0d9a0" text-anchor="middle" font-weight="bold" opacity="0.9">TRANSFORM</text>
  </g>
  
  <!-- 右侧：成衣剪影 -->
  <g transform="translate(1500, 300)">
    <!-- T恤剪影 -->
    <path d="M-60,-80 L-60,80 L60,80 L60,-80 Z M-60,-80 L-90,-60 L-90,-20 L-60,-40 Z M60,-80 L90,-60 L90,-20 L60,-40 Z" 
          fill="none" stroke="#d4a574" stroke-width="3" opacity="0.9"/>
    
    <!-- 衣领 -->
    <path d="M-20,-80 Q0,-60 20,-80" stroke="#f0d9a0" stroke-width="2" fill="none"/>
    
    <!-- 袖子细节 -->
    <path d="M-60,-60 L-90,-40" stroke="#d4a574" stroke-width="2" opacity="0.7"/>
    <path d="M60,-60 L90,-40" stroke="#d4a574" stroke-width="2" opacity="0.7"/>
    
    <!-- 成衣标签 -->
    <rect x="-30" y="-20" width="60" height="40" fill="none" stroke="#f0d9a0" stroke-width="2" rx="5" opacity="0.8"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" fill="#f0d9a0" text-anchor="middle" font-weight="bold">HONGJIN</text>
  </g>
  
  <!-- 主标题 - 中文 -->
  <text x="960" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="56" fill="#ffffff" text-anchor="middle" font-weight="bold" filter="url(#glow)">从一缕纱线到一件成衣</text>
  
  <!-- 副标题 - 英文 -->
  <text x="960" y="180" font-family="Arial, sans-serif" font-size="28" fill="#d4a574" text-anchor="middle" font-weight="300" letter-spacing="2">Fabric to Garment, One-Stop Solution</text>
  
  <!-- 底部装饰线 -->
  <line x1="660" y1="520" x2="1260" y2="520" stroke="url(#goldGradient)" stroke-width="3" opacity="0.8"/>
  
  <!-- 数据标签 -->
  <g transform="translate(960, 560)">
    <text x="-200" y="0" font-family="Arial, sans-serif" font-size="18" fill="#f0d9a0" text-anchor="middle">500+ SKU</text>
    <text x="-70" y="0" font-family="Arial, sans-serif" font-size="18" fill="#f0d9a0" text-anchor="middle">15年经验</text>
    <text x="70" y="0" font-family="Arial, sans-serif" font-size="18" fill="#f0d9a0" text-anchor="middle">98% 交付率</text>
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="18" fill="#f0d9a0" text-anchor="middle">30+ 国家</text>
  </g>
  
  <!-- 装饰性光点 -->
  <circle cx="200" cy="100" r="3" fill="#f0d9a0" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1700" cy="500" r="3" fill="#d4a574" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="500" r="2" fill="#f0d9a0" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>